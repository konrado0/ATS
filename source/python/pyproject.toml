[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-research"
version = "0.4.0"
description = "Correctness-first ATS Phase A research and Phase B canonical data"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas>=3",
  "polars>=1.43",
  "pyarrow>=25",
  "pydantic>=2.13",
  "PyYAML",
  "duckdb>=1.5",
  "psutil>=7",
]

[project.scripts]
ats-research = "ats_research.cli:main"
ats-data = "ats_data.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
